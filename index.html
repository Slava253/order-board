<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Табло заказов</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#000; color:#fff; }
    button, input { width:100%; padding:14px; font-size:18px; margin-bottom:10px; }
    button { font-weight:bold; border:none; border-radius:8px; cursor:pointer; }

    .split { display:flex; height:100vh; }
    .column { flex:1; padding:20px; box-sizing:border-box; }
    .column h1 { text-align:center; font-size:32px; }

    .cooking { background:#111; }
    .ready { background:#020617; }

    .order { background:#22c55e; color:#000; font-size:32px; font-weight:bold; padding:12px; border-radius:12px; text-align:center; margin-bottom:10px; }

    .order-buttons { display:flex; gap:10px; margin-top:10px; }
    .btn-ready { background:#38bdf8; }
    .btn-take { background:#f87171; }

    .phone { display:none; padding:10px; }
    .phone-columns { display:flex; gap:10px; }
  </style>
</head>
<body>

<!-- 📱 ТЕЛЕФОН -->
<div id="phoneUI" class="phone">
  <input id="orderInput" placeholder="Номер заказа" />
  <button onclick="addCooking()">Готовится</button>

  <div class="phone-columns">
    <div class="column cooking">
      <h1>Готовится</h1>
      <div id="phoneCooking"></div>
    </div>
    <div class="column ready">
      <h1>Готов</h1>
      <div id="phoneReady"></div>
    </div>
  </div>
</div>

<!-- 🖥 ТАБЛО -->
<div id="board" class="split">
  <div class="column cooking">
    <h1>Готовится</h1>
    <div id="boardCooking"></div>
  </div>
  <div class="column ready">
    <h1>Готов</h1>
    <div id="boardReady"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// 🔥 Firebase
firebase.initializeApp({
  apiKey: "AIzaSyB3_VFBQzqZkV2lOyf_2rieD9lPSWqEee0",
  authDomain: "order-board-91ee0.firebaseapp.com",
  databaseURL: "https://order-board-91ee0-default-rtdb.firebaseio.com",
  projectId: "order-board-91ee0"
});

const db = firebase.database();
const cookingRef = db.ref('cooking');
const readyRef = db.ref('ready');

// 📱 или 🖥
const params = new URLSearchParams(location.search);
const isPhone = params.get('control') === '1' && window.innerWidth <= 600;

document.getElementById('phoneUI').style.display = isPhone ? 'block' : 'none';
document.getElementById('board').style.display = isPhone ? 'none' : 'flex';

// 🎨 Рендер
function render(ref, el, mode, controls) {
  ref.on('value', snap => {
    el.innerHTML = '';
    snap.forEach(c => {
      const d = document.createElement('div');
      d.className = 'order';
      d.textContent = '№ ' + c.val();

      if (controls) {
        const btns = document.createElement('div');
        btns.className = 'order-buttons';

        if (mode === 'cooking') {
          const b = document.createElement('button');
          b.textContent = 'Готов';
          b.className = 'btn-ready';
          b.onclick = () => moveToReady(c.key, c.val());
          btns.appendChild(b);
        }
        if (mode === 'ready') {
          const b = document.createElement('button');
          b.textContent = 'Заказ забрали';
          b.className = 'btn-take';
          b.onclick = () => readyRef.child(c.key).remove();
          btns.appendChild(b);
        }
        d.appendChild(btns);
      }
      el.appendChild(d);
    });
  });
}

render(cookingRef, boardCooking, 'cooking', false);
render(readyRef, boardReady, 'ready', false);
render(cookingRef, phoneCooking, 'cooking', true);
render(readyRef, phoneReady, 'ready', true);

// ➕ Добавить заказ
function addCooking() {
  let n = orderInput.value.trim();
  if (!n) return;
  cookingRef.push(formatNumber(n));
  orderInput.value = '';
}

function moveToReady(key, val) {
  cookingRef.child(key).remove();
  readyRef.push(val);
}

// 🔁 Авто-заказ каждые 20 сек (только ПК)
if (!isPhone) {
  let counter = 0;
  setInterval(() => {
    counter++;
    cookingRef.push(formatNumber(counter));
  }, 20000);
}

// 🔢 Формат номера
function formatNumber(n) {
  n = parseInt(n, 10);
  if (n < 10) return '00' + n;
  if (n < 100) return '0' + n;
  return String(n);
}
</script>
</body>
</html>
